[package]
name = "duplicate-file-report"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A safe, report-only duplicate file finder"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
